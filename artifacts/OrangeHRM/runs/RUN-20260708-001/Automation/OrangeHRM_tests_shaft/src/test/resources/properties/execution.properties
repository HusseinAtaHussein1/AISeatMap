# RUN-20260708-001 — Login & Access Suite (SHAFT Engine)
# Target environment per Project Context v2 (RUN-20260706-002), §5 Environment Constraints.

targetOperatingSystem=Windows
executionAddress=local
targetBrowserName=chrome
headlessExecution=false

baseURL=https://opensource-demo.orangehrmlive.com/web/index.php

# Timeouts kept generous but bounded: TC-LOGIN-009 (FINDING-005) deliberately exercises a path
# that currently hangs to an infrastructure-level 504 on the live demo. A too-short timeout would
# turn that into an ambiguous timeout exception instead of a clean assertion failure against the
# corrected-behavior expectation. See OrangeHRM_AutomationPlan.md §12 and the Automation Decision
# Report's Known Limitations for TC-LOGIN-009.
browserNavigationTimeout=90
defaultElementIdentificationTimeout=15
