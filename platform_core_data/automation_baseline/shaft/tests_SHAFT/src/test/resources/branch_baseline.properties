# Baseline valid Branch data -- shared fixture for every test case that needs
# "every other mandatory field filled with valid data" (Automation Plan §5 Shared Test Data).
# Values mirror the Test Design suite's own Test Data where stated (TC-BR-001, TC-BR-021, etc.).

operatingCountry=EgyptUAT
# The Country the application auto-fills once operatingCountry is selected. These two MUST stay
# consistent with each other: TC-BR-004 asserts exactly this mapping (EgyptUAT -> Egypt), and
# TC-BR-046 selects this same value in the Search screen's Country filter. Changing one without the
# other silently breaks both tests. Externalised 2026-08-15 from two separate in-class literals.
country=Egypt
state=Cairo
city=Cairo
address1=1 Test Street
postOfficeBox=QA12345
phoneNumber=1001234567
emailPassword=Passw0rd!2026
contactName=Ahmed Ayman
contactPhoneNumber=1001234567
creditLimit=50000
topUpLimit=10000
creditTermsDays=30
outstandingThreshold=10

# Added by the 2026-08-06 healing pass. Every value below is live-verified against STG
# (modules/branch/healing/evidence_0806/), not assumed.
#
# credentialName -- the Product Access grid's Credential Name dropdown is mandatory once a supplier
# row is checked, and "Live" is the only option the dropdown actually offers on STG
# (diagnosis.log, D5). Without it the checked row is incomplete and no submission can succeed.
credentialName=Live
# Branch Sales Configuration mandatory fields the baseline fixture never filled (diagnosis.log, D3).
# Target Amount is not a plain number: the application answers a bare amount with "Please select
# month and year, and enter a numeric amount." and exposes #id-SetMonth / #id-SetYear beside it
# (diagnosis3.log, B).
# Must stay BELOW creditLimit (50000): the application enforces "Target amount should be less than
# credit limit amount" (observed verbatim on the 2026-08-06 healing rerun, REPAIR-BR-006).
targetAmount=10000
targetMonth=January
targetYear=2027
reachingPercentage=80
warningPromptDays=5

# Free-text Description for the selected Product Access row. Externalised 2026-08-15 from a literal
# inside AddBranch_Page.fillMandatoryBaseline -- test data does not belong in a Page Object.
productAccessDescription=QA product access description

# ── Pre-existing STG search fixtures ───────────────────────────────────────────────────────────────
# Read-only references used by the Search suite, which never mutates a record. Externalised
# 2026-08-15 from in-class constants in SearchBranch_TC.
#
# THESE TWO ARE INDEPENDENT FIXTURES, NOT A CODE/NAME PAIR. They identify two different branches and
# are used by two different test cases (TC-BR-040 searches by code, TC-BR-041 searches by name). Do
# not "correct" one to match the other. The live diagnosis of 2026-08-14
# (healing/FilterDiagnosis_BranchSearch_2026-08-14.md §3.6) confirmed the branch named
# "Emirates NDC" carries the code BRN22 -- not BRN2.
#
# Both are pre-existing records on a shared environment and can be renamed or deactivated by anyone
# using it. A failure naming either value is an environment data gap, not an application defect.
knownBranchCode=BRN2
knownBranchName=Emirates NDC

# A branch whose Approval Status is "Rejected", for TC-BR-054's icon check.
#
# Why this is configured rather than scanned for: rejected records sit deep in the default ordering.
# Located live 2026-08-15 at page 18 of ~52 — far past the 10-page scan limit, which is why TC-BR-054
# reported "no Rejected row found" as an environment data gap. Searching for it by code costs one
# search instead of 18 page hops, and fails with a clear message if the record's state ever changes.
#
# Approved and Pending are NOT configured here: both are reliably present on page 1 (the newest
# records sort first), so scanning finds them immediately and no fixture is needed.
#
# If this record is ever approved by someone, TC-BR-054 will say so by name. Replace it with any
# other Rejected branch code — nothing else needs to change.
knownRejectedBranchCode=BRN466
