# Baseline valid Agency data -- the shared fixture for every test case that needs "every other
# mandatory field filled with valid data" (Automation Plan §5). Mirrors branch_baseline.properties
# deliberately rather than inventing a second convention.
#
# Every value here is synthetic and non-sensitive (ProjectContext PO-4). Nothing below can reach a
# real mailbox, phone, or host.

# ── The Branch/Country cascade ─────────────────────────────────────────────────────────────────
# On the Add Agency form, Country is READONLY and derived from the selected Branch -- verified live
# 2026-08-18 (#id-Country readonly=true with no p-dropdown wrapper). It is therefore never typed or
# selected; it is asserted. This value must match what the fixture Branch resolves to, which is why
# it is the same Egypt that branch_baseline.properties maps EgyptUAT to. Changing one without the
# other breaks the fixture silently.
country=Egypt
state=Cairo
city=Cairo

address1=1 Test Street
postOfficeBox=QA12345

# ── Payment settings ───────────────────────────────────────────────────────────────────────────
# Lower-case "monthly" -- confirmed live 2026-08-19 (Stage 5H diagnosis): this dropdown's own three
# options render exactly as "BiWeekly", "annually", "monthly" -- inconsistent casing on the
# application's part, not a typo here. An exact-match selector fails silently otherwise; the earlier
# "Monthly" was never verified against the live option text and would have been the next failure.
invoiceGeneration=monthly
creditLimit=50000
topUpLimit=10000
creditTermsDays=30
# Outstanding Threshold, Reaching Percentage and Warning Prompt (Days) are deliberately NOT configured
# here. Outstanding Threshold arrives pre-filled (observed value 5) and the other two are optional, so
# fillMandatoryBaseline never sets any of them. A property nothing reads is a second source of truth
# waiting to drift out of step with the form.

# The Payment option checkbox the fixture ticks. "Cash" is chosen because it is one of only three
# payment options on this form that name an actual payment method.
#
# WHY THAT NEEDS SAYING: the live form offers 29 Payment option checkboxes, of which 26 are
# personal first names or single letters -- id-Paymentoption-Edgardo, -Isaiah, -Filomena, -Astrid,
# -Olive, -Monserrate, -m, -f, and so on (verified live 2026-08-18, evidence
# addform_locator_verification_run004.json). That is FINDING-011 (payment-option data pollution),
# confirmed still present on this build. Only Cash, Wallet and CreditCard are real options. Do not
# "add coverage" for the others: they are polluted reference data, not product behaviour.
paymentOption=Cash

# ── Contract dates ─────────────────────────────────────────────────────────────────────────────
# Format is dd/MM/yyyy as the form renders it. Fixed rather than computed from today's date so a
# failure is reproducible: a relative date makes a test that passed yesterday fail today for
# reasons unrelated to the application.
contractStartDate=01/01/2026
contractEndDate=31/12/2027

# ── Product Access ─────────────────────────────────────────────────────────────────────────────
# "Please select at least one supplier." is a section-level mandatory rule (verified live during
# Discovery on the empty create form). The supplier rows come from the selected Branch's own
# suppliers, which is why the fixture Branch must be created with suppliers -- see PO-14 and BR-006.
#
# Credential Name and the Product Access description are NOT duplicated here. They belong to the Add
# BRANCH form's Product Access grid, and branch_baseline.properties already owns them
# (credentialName=Live, productAccessDescription=...). Copying them into this file would create two
# sources of truth for one value, and the copies would drift apart silently. SupplierBranchProvisioner
# reads BranchTestData for both.

# ── Known, reusable Branch fixture (operator instruction, 2026-08-20) ──────────────────────────────
# Every prior run of this suite built its own new Branch (PO-14: "the run may build its own Branch").
# That is correct in principle but leaves one permanent, un-deletable Branch on STG per execution
# (PO-3: no DELETE). The operator's explicit instruction: settle on ONE already-created, already-
# working Branch and build every Agency fixture beneath that one instead.
#
# This Branch is a real record on STG, live-verified 2026-08-20: Approved, carrying suppliers
# 3O and AegeanNdc (>= BR-006's two-supplier threshold), created by an earlier run of this same
# suite (SupplierBranchProvisioner.createApprovedBranchWithSuppliers).
#
# Read-only from here on: AgencyFixture only SEARCHES for this Branch and reads it; it is never
# created, edited, or re-approved by this suite once configured here. If this record is ever
# deactivated, renamed, or removed by someone else on this shared environment, the fixture fails
# naming this exact value -- an environment data gap, not an application defect -- and either this
# property should be pointed at a different known-good Branch, or removed so the suite falls back
# to building a fresh one (SupplierBranchProvisioner.createApprovedBranchWithSuppliers).
knownApprovedBranchCode=BRN908
knownApprovedBranchName=QA_694969440098400
# Comma-separated, in the order read back from the Branch's own Product Access grid when it was
# created. Configured rather than re-scanned on every run, exactly like branch_baseline.properties'
# knownBranchCode/knownRejectedBranchCode fixtures -- one search instead of opening the Update Branch
# screen and reading its supplier rows every single execution.
knownApprovedBranchSuppliers=3O,AegeanNdc
