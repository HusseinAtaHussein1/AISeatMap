            - generic [ref=f54e8036]:
              - generic [ref=f54e8037]:
                - paragraph
                - list [ref=f54e8038]:
                  - listitem [ref=f54e8039]: "تنبيه هام من ⁦NDC⁩: جميع التذاكر بداية من جمهورية مصر العربية الى المملكة العربية السعودية لا تصلح للعمرة الا فى حالة استيفاء شروط وزارة السياحة المصرية و الحصول على البار كود و في حالة اصدار التذاكر لغرض العمرة من سيستم ⁦NDC⁩ دون التقييد بشروط وزارة السياحة تقع المسئولية على الشركة المصدرة او العميل المصدر للتذكرة دون ادني مسئولية على شركة وندر للسياحة"
              - generic [ref=f54e8040]:
                - paragraph [ref=f54e8041]: Check-in Time
                - list [ref=f54e8042]:
                  - listitem [ref=f54e8043]: Check-in counters open 3 hours prior to departure of flight and close 1 hour prior to departure of flight, you may be denied boarding if you fail to report on time.
              - generic [ref=f54e8044]:
                - paragraph [ref=f54e8045]: Ticketing & Reservation
                - list [ref=f54e8046]:
                  - listitem [ref=f54e8047]: Please Re-check the passenger name(s) as per the passport/identity proof, departure & arrival date, time, flight number, terminal, baggage details etc.
                - list [ref=f54e8048]:
                  - listitem [ref=f54e8049]: The local authorities in certain countries may impose additional taxes (VAT, tourist tax etc.), which generally has to be paid locally.
                - list [ref=f54e8050]:
                  - listitem [ref=f54e8051]: In case of International travel, please check your requirements for travel documentation like valid Passport/visa/Ok to Board/travel and medical insurance with the airline and relevant Embassy or Consulate before commencing your journey.
                - list [ref=f54e8052]:
                  - listitem [ref=f54e8053]: We are not responsible for any schedule change/flight cancellation by the airline before and after issuance of the tickets.
                - list [ref=f54e8054]:
                  - listitem [ref=f54e8055]: Wonder Travel will not be held responsible for any loss or damage to travelers and his/her belongings due to any accident, theft or other Mishap / Unforeseen circumstances).
              - generic [ref=f54e8056]:
                - paragraph [ref=f54e8057]: Amendment & Cancellation
                - list [ref=f54e8058]:
                  - listitem [ref=f54e8059]: For any amendments, cancellation or ancillary services for flights, you may connect with our (24 X 7) reservation team on Tel +20-1215484845 or email to Hussien.ata@tildetech.ae with a copy to your respective Wonder Travel Key account manager.
                - list [ref=f54e8060]:
                  - listitem [ref=f54e8061]: Any amendments of the booking will be as per the airline terms and conditions comprising of penalties, fare difference which may change upon subject to availability by the airline.
                - list [ref=f54e8062]:
                  - listitem [ref=f54e8063]: Any Cancellation/Refund of booking will be handled from case to case basis depending on the airline and agency terms and conditions.
