          - generic [ref=f98e372]:
            - generic [ref=f98e373]:
              - paragraph
              - list [ref=f98e374]:
                - listitem [ref=f98e375]: "تنبيه هام من ⁦NDC⁩: جميع التذاكر بداية من جمهورية مصر العربية الى المملكة العربية السعودية لا تصلح للعمرة الا فى حالة استيفاء شروط وزارة السياحة المصرية و الحصول على البار كود و في حالة اصدار التذاكر لغرض العمرة من سيستم ⁦NDC⁩ دون التقييد بشروط وزارة السياحة تقع المسئولية على الشركة المصدرة او العميل المصدر للتذكرة دون ادني مسئولية على شركة وندر للسياحة"
            - generic [ref=f98e376]:
              - paragraph [ref=f98e377]: Check-in Time
              - list [ref=f98e378]:
                - listitem [ref=f98e379]: Check-in counters open 3 hours prior to departure of flight and close 1 hour prior to departure of flight, you may be denied boarding if you fail to report on time.
            - generic [ref=f98e380]:
              - paragraph [ref=f98e381]: Ticketing & Reservation
              - list [ref=f98e382]:
                - listitem [ref=f98e383]: Please Re-check the passenger name(s) as per the passport/identity proof, departure & arrival date, time, flight number, terminal, baggage details etc.
              - list [ref=f98e384]:
                - listitem [ref=f98e385]: The local authorities in certain countries may impose additional taxes (VAT, tourist tax etc.), which generally has to be paid locally.
              - list [ref=f98e386]:
                - listitem [ref=f98e387]: In case of International travel, please check your requirements for travel documentation like valid Passport/visa/Ok to Board/travel and medical insurance with the airline and relevant Embassy or Consulate before commencing your journey.
              - list [ref=f98e388]:
                - listitem [ref=f98e389]: We are not responsible for any schedule change/flight cancellation by the airline before and after issuance of the tickets.
              - list [ref=f98e390]:
                - listitem [ref=f98e391]: Wonder Travel will not be held responsible for any loss or damage to travelers and his/her belongings due to any accident, theft or other Mishap / Unforeseen circumstances).
            - generic [ref=f98e392]:
              - paragraph [ref=f98e393]: Amendment & Cancellation
              - list [ref=f98e394]:
                - listitem [ref=f98e395]: For any amendments, cancellation or ancillary services for flights, you may connect with our (24 X 7) reservation team on Tel +20-1215484845 or email to Hussien.ata@tildetech.ae with a copy to your respective Wonder Travel Key account manager.
              - list [ref=f98e396]:
                - listitem [ref=f98e397]: Any amendments of the booking will be as per the airline terms and conditions comprising of penalties, fare difference which may change upon subject to availability by the airline.
              - list [ref=f98e398]:
                - listitem [ref=f98e399]: Any Cancellation/Refund of booking will be handled from case to case basis depending on the airline and agency terms and conditions.
